<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <!-- Apply ?theme=dark before first paint, so the light theme never flashes. -->
    <script>
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      })()
    </script>
    <title>TeamWisdom — оценка людей и сборка команд</title>
    <meta
      name="description"
      content="TeamWisdom тестирует навыки, характер и стиль работы — и показывает, какая роль подходит каждому и с кем он сработается."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
